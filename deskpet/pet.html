<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title></title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      -webkit-user-select: none;
    }
    #live2d-widget-container {
      position: fixed !important;
      inset: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      pointer-events: none;
    }
    #live2d-widget-canvas {
      width: 100% !important;
      height: 100% !important;
      pointer-events: auto !important;
      display: block;
      cursor: grab;
    }
    #live2d-widget-canvas:active {
      cursor: grabbing;
    }
    /*
     * 仅 html.deskpet-reveal（点击穿透开启）时生效。
     * 遮罩 alpha：中心 0（看见下层桌面）→ 半径处 1（角色完全不透明），半径外保持不透明。
     * 坐标是视口 CSS 像素，由 desktop-init.js 写入 --deskpet-reveal-x/y。
     */
    html.deskpet-reveal body {
      --deskpet-reveal-r: 120px;
      -webkit-mask-image: radial-gradient(
        circle var(--deskpet-reveal-r) at var(--deskpet-reveal-x, -10000px) var(--deskpet-reveal-y, -10000px),
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 1) 100%
      );
      mask-image: radial-gradient(
        circle var(--deskpet-reveal-r) at var(--deskpet-reveal-x, -10000px) var(--deskpet-reveal-y, -10000px),
        rgba(0, 0, 0, 0) 0%,
        rgba(0, 0, 0, 1) 100%
      );
      -webkit-mask-repeat: no-repeat;
      mask-repeat: no-repeat;
      -webkit-mask-mode: alpha;
      mask-mode: alpha;
    }
  </style>
</head>
<body>
  <script src="./libs/lpkr.min.js"></script>
  <script src="./desktop-init.js"></script>
</body>
</html>
