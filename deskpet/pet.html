<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>桌宠</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      user-select: none;
      -webkit-user-select: none;
    }
    #live2d-widget-container {
      position: fixed !important;
      inset: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100% !important;
      height: 100% !important;
      z-index: 1 !important;
      pointer-events: none;
    }
    #live2d-widget-canvas {
      width: 100% !important;
      height: 100% !important;
      pointer-events: auto !important;
      display: block;
      cursor: grab;
    }
    #live2d-widget-canvas:active {
      cursor: grabbing;
    }
  </style>
</head>
<body>
  <script src="./libs/lpkr.min.js"></script>
  <script src="./desktop-init.js"></script>
</body>
</html>
